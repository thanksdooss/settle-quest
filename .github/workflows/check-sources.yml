# 원문이 바뀌었는지 확인한다. 바뀌면 규칙을 고치는 대신 사람을 부른다.
#
# 주간 자동 실행(schedule)은 꺼 두었다. 첫 실행에서 한국 공공기관 사이트 12곳이 모두
# GitHub Actions(해외 데이터센터 IP)의 접속을 막았다. 그 상태로 매주 돌리면
# "접속 실패" 이슈만 쌓인다. 주간 점검은 한국 IP에서 `npm run rules:weekly` 로 돌린다.
# 이 워크플로는 한국에서 접속되는 러너(자체 호스팅 등)를 붙일 때를 위해 남겨 둔다.
name: 원문 변경 감지

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: 원문 비교
        id: check
        # 종료 코드 2 = 출처에 하나도 닿지 못함(실행 환경 문제). 이때는 이슈를 열지 않고 실패로 끝낸다.
        run: |
          set +e
          node scripts/check-sources.mjs --write
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then exit 2; fi
          exit 0

      - name: 커버리지 갱신
        run: node scripts/coverage.mjs

      - name: 변경 사항 커밋
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add rules docs/review-queue.md public/coverage.json README.md
            git commit -m '규칙: 원문 변경 감지 결과 반영 (자동)'
            git push
          fi

      - name: 검토 이슈 열기
        if: steps.check.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('docs/review-queue.md', 'utf8')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `원문 변경 검토 필요 — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['규칙 검토'],
            })
