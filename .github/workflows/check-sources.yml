# 주 1회 원문이 바뀌었는지 확인한다. 바뀌면 규칙을 고치는 대신 사람을 부른다.
#
# 첫 실행에서 출처 12건이 한꺼번에 실패해 해외 IP 차단으로 의심했으나,
# 진단해 보니 DNS·TLS·HTTP 모두 정상이었고 일시적인 장애였다(scripts/diagnose-sources.mjs).
# 그래서 자동 실행을 되살리고, 대신 재시도와 "전부 실패 = 환경 문제" 판정을 넣었다.
name: 원문 변경 감지

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: 원문 비교
        id: check
        # 종료 코드 2 = 출처에 하나도 닿지 못함(실행 환경 문제). 이때는 이슈를 열지 않고 실패로 끝낸다.
        run: |
          set +e
          node scripts/check-sources.mjs --write
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then exit 2; fi
          exit 0

      - name: 커버리지 갱신
        run: node scripts/coverage.mjs

      - name: 변경 사항 커밋
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add rules docs/review-queue.md public/coverage.json README.md
            git commit -m '규칙: 원문 변경 감지 결과 반영 (자동)'
            git push
          fi

      - name: 검토 이슈 열기
        if: steps.check.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('docs/review-queue.md', 'utf8')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `원문 변경 검토 필요 — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['규칙 검토'],
            })
